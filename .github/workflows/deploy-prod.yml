# Production (https://ds.csamrita.org) is deployed by Vercel's GitHub
# integration on pushes to main. This workflow only type-checks main.
name: Type-check main

on:
  push:
    branches:
      - main

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - name: Type-check
        run: npx tsc --noEmit
